# ===============================
# LOCAL SECRETS
# ===============================

spring.config.import=optional:file:${user.home}/.course-platform-secrets.properties


# ===============================
# SERVER
# ===============================

server.port=${PORT:8081}


# ===============================
# PostgreSQL
# ===============================

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/course_db}

spring.datasource.username=${DATABASE_USERNAME:postgres}

spring.datasource.password=${DATABASE_PASSWORD}


# ===============================
# FLYWAY
# ===============================

spring.flyway.enabled=${FLYWAY_ENABLED:true}

spring.flyway.locations=classpath:db/migration

spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}

spring.flyway.baseline-version=1

spring.flyway.validate-on-migrate=true


# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

spring.jpa.show-sql=${JPA_SHOW_SQL:true}

spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW:false}


# ===============================
# MongoDB
# ===============================

spring.mongodb.uri=${MONGODB_URI}


# ===============================
# ImageKit
# ===============================

imagekit.url-endpoint=${IMAGEKIT_URL_ENDPOINT:https://ik.imagekit.io/courseplatform}

imagekit.private-key=${IMAGEKIT_PRIVATE_KEY}


# ===============================
# JWT
# ===============================

app.jwt.secret=${JWT_SECRET}

app.jwt.expiration-ms=${JWT_EXPIRATION_MS:7200000}


# ===============================
# AUTH COOKIE
# ===============================

app.auth.cookie-name=access_token

app.auth.cookie-secure=${COOKIE_SECURE:false}


# ===============================
# CORS
# ===============================

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}


# ===============================
# EMAIL / SMTP
# ===============================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}

spring.mail.port=${MAIL_PORT:587}

spring.mail.username=${MAIL_USERNAME:}

spring.mail.password=${MAIL_PASSWORD:}


spring.mail.properties[mail.smtp.auth]=${MAIL_SMTP_AUTH:true}

spring.mail.properties[mail.smtp.starttls.enable]=${MAIL_STARTTLS_ENABLE:true}

spring.mail.properties[mail.smtp.starttls.required]=${MAIL_STARTTLS_REQUIRED:true}


spring.mail.properties[mail.smtp.connectiontimeout]=${MAIL_CONNECTION_TIMEOUT:5000}

spring.mail.properties[mail.smtp.timeout]=${MAIL_TIMEOUT:5000}

spring.mail.properties[mail.smtp.writetimeout]=${MAIL_WRITE_TIMEOUT:5000}


app.mail.from=${MAIL_FROM:}


# ===============================
# FILE / VIDEO UPLOAD
# ===============================

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:200MB}

spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:200MB}