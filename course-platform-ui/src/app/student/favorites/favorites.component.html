<div>

  <!-- BAŞLIK -->

  <div style="margin-bottom: 30px;">

    <h1
      style="
        margin: 0;
        color: #1f2937;
      "
    >
      ❤️ Favorilerim
    </h1>

    <p
      style="
        margin-top: 8px;
        color: #6b7280;
      "
    >
      Daha sonra incelemek istediğiniz kursları burada bulabilirsiniz.
    </p>

  </div>


  <!-- YÜKLENİYOR -->

  <div
    *ngIf="isLoading"
    style="
      background: white;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      padding: 50px;
      text-align: center;
      color: #6b7280;
    "
  >
    ⏳ Favoriler yükleniyor...
  </div>


  <!-- FAVORİ YOK -->

  <div
    *ngIf="
      !isLoading &&
      favoriteCourses.length === 0
    "
    style="
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 60px 20px;
      text-align: center;
    "
  >

    <div
      style="
        font-size: 55px;
        margin-bottom: 10px;
      "
    >
      🤍
    </div>


    <h2
      style="
        color: #1f2937;
      "
    >
      Henüz favori kursunuz yok
    </h2>


    <p
      style="
        color: #6b7280;
      "
    >
      Beğendiğiniz kursları favorilerinize ekleyerek daha sonra kolayca bulabilirsiniz.
    </p>


    <button
      (click)="goToMarketplace()"
      style="
        margin-top: 15px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 7px;
        padding: 11px 20px;
        cursor: pointer;
        font-weight: bold;
      "
    >
      🛍️ Kursları Keşfet
    </button>

  </div>


  <!-- FAVORİ KURSLAR -->

  <div
    *ngIf="
      !isLoading &&
      favoriteCourses.length > 0
    "
    style="
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
    "
  >

    <div
      *ngFor="let course of favoriteCourses"
      style="
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 3px 12px rgba(0,0,0,0.05);
      "
    >

      <!-- KURS GÖRSELİ -->

      <img
        *ngIf="course.imageUrl"
        [src]="course.imageUrl"
        [alt]="course.name"
        style="
          width: 100%;
          height: 180px;
          object-fit: cover;
          display: block;
        "
      >


      <div
        *ngIf="!course.imageUrl"
        style="
          height: 180px;
          background: #f3f4f6;
          display: flex;
          justify-content: center;
          align-items: center;
          font-size: 45px;
        "
      >
        🎓
      </div>


      <div style="padding: 20px;">

        <h2
          style="
            margin-top: 0;
            color: #1f2937;
            font-size: 20px;
          "
        >
          {{ course.name }}
        </h2>


        <p
          style="
            color: #6b7280;
            font-size: 14px;
            min-height: 55px;
          "
        >
          {{ course.description }}
        </p>


        <div
          style="
            font-size: 23px;
            color: #16a34a;
            font-weight: bold;
            margin-bottom: 15px;
          "
        >
          {{ course.price }} ₺
        </div>


        <button
          (click)="goToMarketplace()"
          style="
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            padding: 11px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 8px;
          "
        >
          🛍️ Mağazada Gör
        </button>


        <button
          (click)="removeFavorite(course)"
          style="
            width: 100%;
            background: #fff1f2;
            color: #be123c;
            border: 1px solid #fecdd3;
            border-radius: 7px;
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
          "
        >
          ❤️ Favorilerden Çıkar
        </button>

      </div>

    </div>

  </div>

</div>
